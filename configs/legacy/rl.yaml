training:
  episodes: 60
  episode_orders: 10000
  lr: 0.001
  gamma: 0.99
  batch_size: 256
  target_update_steps: 2000
  train_start_size: 3000
  train_every_steps: 4
  updates_per_episode: 500
  ckpt_every: 10

epsilon:
  start: 1.0
  end: 0.05
  decay_steps: 200000

network:
  input_dim: 8
  hidden_dim: 64

buffer:
  capacity: 200000

reward:
  reward_mode: rl1_current   # rl1_current | urgent_protection
  w_urgent: 5.0
  w_normal: 2.0
  late_penalty_urgent: 2.0
  late_penalty_normal: 1.0
  lateness_cap_mult: 2.0

evaluation:
  every_episodes: 10
  seeds: 3

scenario_mix:
  enabled: true
  scenarios:
    - name: s211
      prob: 0.6
      workers: [2, 1, 1]
      dec_cap: 4500
    - name: s111
      prob: 0.3
      workers: [1, 1, 1]
      dec_cap: 3000
    - name: s221
      prob: 0.1
      workers: [2, 2, 1]
      dec_cap: 6000
