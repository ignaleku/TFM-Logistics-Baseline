training:
  episodes: 60
  episode_orders: 10000
  lr: 0.001
  gamma: 0.99
  batch_size: 256
  target_update_steps: 2000
  train_start_size: 3000
  train_every_steps: 4
  updates_per_episode: 500
  ckpt_every: 10

epsilon:
  start: 1.0
  end: 0.05
  decay_steps: 250000      # slightly larger than RL-3: 5 decision stages vs 3

network:
  input_dim: 19            # [pick_u, pick_n, qc_u, qc_n, pack_u, pack_n, lab_u, lab_n,
                           #  disp_u, disp_n, wip_pick, wip_qc, wip_pack, wip_lab, wip_disp,
                           #  time_norm, slack_u, slack_n, stage_id]
  hidden_dim: 64

buffer:
  capacity: 250000         # slightly larger than RL-3 due to more transitions per order

# RL-5 uses the same rl1_current reward as RL-3
reward:
  reward_mode: rl1_current
  w_urgent: 5.0
  w_normal: 2.0
  late_penalty_urgent: 2.0
  late_penalty_normal: 1.0
  lateness_cap_mult: 2.0

# Mix covers regimes where different stages become the bottleneck,
# matching the matrix used in the baseline simulation.
scenario_mix:
  enabled: true
  scenarios:
    - name: s21111
      prob: 0.25
      workers: [2, 1, 1, 1, 1]   # picking partially relieved; QC/packing bottleneck
    - name: s31111
      prob: 0.25
      workers: [3, 1, 1, 1, 1]   # picking comfortable; QC bottleneck
    - name: s32111
      prob: 0.30
      workers: [3, 2, 1, 1, 1]   # packing bottleneck (highest weight)
    - name: s32211
      prob: 0.20
      workers: [3, 2, 2, 1, 1]   # labelling / dispatch bottleneck
