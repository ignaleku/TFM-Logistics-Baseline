simulation:
  random_seed: 123
  policy: urgent_first         # fifo | urgent_first
  time_unit: seconds

resources:
  picking_workers:       1
  quality_check_workers: 1
  packing_workers:       1
  labelling_workers:     1
  dispatch_workers:      1

service_time:
  picking:
    base_minutes: 1.5
    minutes_per_item: 0.70
    class_multiplier: {A: 1.0, B: 1.2, C: 1.6}
    noise_lognormal_sigma: 0.25
    min_minutes: 0.2

  quality_check:
    base_minutes: 0.9
    minutes_per_item: 0.30
    class_multiplier: {A: 1.0, B: 1.3, C: 1.8}
    noise_lognormal_sigma: 0.20
    min_minutes: 0.1

  packing:
    base_minutes: 1.0
    minutes_per_item: 0.40
    class_multiplier: {A: 1.0, B: 1.1, C: 1.3}
    noise_lognormal_sigma: 0.20
    min_minutes: 0.2

  labelling:
    base_minutes: 0.5
    minutes_per_item: 0.10
    class_multiplier: {A: 1.0, B: 1.0, C: 1.05}
    noise_lognormal_sigma: 0.10
    min_minutes: 0.1

  dispatch:
    base_minutes: 0.8
    minutes_per_item: 0.15
    class_multiplier: {A: 1.0, B: 1.05, C: 1.10}
    noise_lognormal_sigma: 0.15
    min_minutes: 0.2