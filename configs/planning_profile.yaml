# configs/planning_profile.yaml
#
# Single source of truth for CLIENT-CALIBRATED planning assumptions: seasonal demand shape,
# order heterogeneity, workload multipliers, SLA targets, uncertainty mapping, workforce
# regimes, and adaptive-search/bottleneck-score parameters.
#
# What does NOT live here: RL reward coefficients (configs/rl3.yaml — internal training
# config, not a business-facing planning assumption) and runtime-per-execution inputs
# (planning_month, expected_annual_orders, uncertainty_level, current workforce, cost
# overrides — those are user-supplied at request time, see src/api/schemas.py).
#
# Values were migrated as-is from the previously hardcoded constants in
# src/data/generate_orders_seasonal.py and src/api/utils.py (which duplicated a subset of
# them) so that regenerating data/orders_base_seasonal.csv produces identical output.

meta:
  version: 1
  base_year: 2026
  total_annual_orders: 240000
  base_seed: 42

# ── SLA definitions ──────────────────────────────────────────────────────────────────────
sla:
  urgent_minutes: 240
  normal_minutes: 1440
  urgent_target: 0.95      # feasibility floor used by recommendation logic (§10)
  normal_target: 0.80

# ── Per-month seasonal shares (must sum to ~1 across all 12 months) ────────────────────────
# product_class_mix is the legacy A/B/C split, kept for backward compatibility with
# `product_class` column already consumed by src/api/utils.py::REQUIRED_ORDER_COLS.
months:
  1:  { name: January,   annual_share: 0.130, urgent_share: 0.20, mean_num_items: 3.6, product_class_mix: [0.43, 0.37, 0.20] }
  2:  { name: February,  annual_share: 0.110, urgent_share: 0.18, mean_num_items: 3.6, product_class_mix: [0.43, 0.37, 0.20] }
  3:  { name: March,     annual_share: 0.070, urgent_share: 0.12, mean_num_items: 2.8, product_class_mix: [0.50, 0.35, 0.15] }
  4:  { name: April,     annual_share: 0.070, urgent_share: 0.12, mean_num_items: 2.8, product_class_mix: [0.50, 0.35, 0.15] }
  5:  { name: May,       annual_share: 0.045, urgent_share: 0.09, mean_num_items: 2.2, product_class_mix: [0.50, 0.35, 0.15] }
  6:  { name: June,      annual_share: 0.040, urgent_share: 0.09, mean_num_items: 2.2, product_class_mix: [0.50, 0.35, 0.15] }
  7:  { name: July,      annual_share: 0.035, urgent_share: 0.08, mean_num_items: 2.2, product_class_mix: [0.50, 0.35, 0.15] }
  8:  { name: August,    annual_share: 0.035, urgent_share: 0.08, mean_num_items: 2.2, product_class_mix: [0.50, 0.35, 0.15] }
  9:  { name: September, annual_share: 0.070, urgent_share: 0.12, mean_num_items: 3.0, product_class_mix: [0.50, 0.35, 0.15] }
  10: { name: October,   annual_share: 0.085, urgent_share: 0.15, mean_num_items: 3.0, product_class_mix: [0.45, 0.37, 0.18] }
  11: { name: November,  annual_share: 0.140, urgent_share: 0.22, mean_num_items: 4.0, product_class_mix: [0.40, 0.38, 0.22] }
  12: { name: December,  annual_share: 0.170, urgent_share: 0.25, mean_num_items: 4.4, product_class_mix: [0.40, 0.38, 0.22] }

# ── Item-count sampling (lognormal around mean_num_items per month) ────────────────────────
item_count:
  ln_sigma: 0.5
  min_items: 1
  max_items: 12

# ── Product family / complexity distributions (split by order_type, constant across months —
#    this matches the current generator, which varies volume/urgency/items by month but not
#    the family/complexity mix itself) ──────────────────────────────────────────────────────
family_distribution:
  normal: { standard: 0.65, fragile: 0.20, bulky: 0.15 }
  urgent: { standard: 0.45, fragile: 0.35, bulky: 0.20 }

complexity_distribution:
  normal: { low: 0.50, medium: 0.35, high: 0.15 }
  urgent: { low: 0.25, medium: 0.45, high: 0.30 }

# ── Workload-unit multipliers (stage service time drivers) ─────────────────────────────────
workload_multipliers:
  picking:  { family: { standard: 1.0, fragile: 1.1, bulky: 1.3 }, complexity: { low: 0.9, medium: 1.1, high: 1.4 } }
  packing:  { family: { standard: 1.0, fragile: 1.8, bulky: 1.6 }, complexity: { low: 0.8, medium: 1.2, high: 1.7 } }
  dispatch: { family: { standard: 1.0, fragile: 1.1, bulky: 1.2 }, complexity: { low: 0.9, medium: 1.1, high: 1.4 }, urgency: { urgent: 1.3, normal: 1.0 } }

# ── Calendar / arrival profile ──────────────────────────────────────────────────────────────
# NOTE: the demand-generation shape below (campaign bursts, intraday hourly weights) describes
# WHEN within a day/month customers place orders — it is independent of worker capacity hours.
# Generated/historical arrival timestamps carrying this shape are compressed onto the finite
# monthly *operating* horizon (hours_per_worker_month, cost_defaults below) by
# src/simulation/multistage/operating_time.py::compress_to_operating_time — see §5/§7. There is
# only ONE capacity-hours source of truth: cost_defaults.hours_per_worker_month.
calendar_profile:
  hours_per_operating_day: 8      # explanatory only (§6 "Equivalent Operating Days" display) —
                                   # NOT a capacity source of truth; never used to bound the sim clock
  campaign_months: [1, 2, 11, 12]
  campaign_burst_multiplier: 3.0  # burst days are Kx the average day weight
  campaign_burst_day_pct: 0.15    # ~15% of days in a campaign month are burst days
  # 24 hourly weights (0-23), biased toward working hours — preserved from the current generator
  intraday_hourly_weights:
    [0.10, 0.05, 0.05, 0.05, 0.15, 0.50,
     1.00, 2.50, 4.00, 4.50, 5.00, 5.00,
     4.50, 4.00, 4.00, 4.00, 4.50, 5.00,
     4.50, 3.00, 2.00, 1.00, 0.50, 0.20]

# ── Uncertainty levels exposed to the user (Low / Standard / High only) ────────────────────
uncertainty_levels:
  low:      { demand_cv: 0.05, arrival_cv: 0.15 }
  standard: { demand_cv: 0.10, arrival_cv: 0.30 }
  high:     { demand_cv: 0.20, arrival_cv: 0.50 }

# ── Future-planning scenario replication ────────────────────────────────────────────────────
future_planning:
  default_replications: 3
  replication_seed_offset: 1000   # replication r of month m uses seed base_seed + m*10 + r*1000
  # Screening + validation strategy (spec §7): all base regimes are screened on replication #1
  # only; the top `screening_finalists` regimes are then validated on the remaining
  # replications before the final recommendation is chosen from the 3-replication aggregate.
  screening_finalists: 4

# ── Workforce regimes (base search space, §0 / §9) ──────────────────────────────────────────
# label: [picking_workers, packing_workers, dispatch_workers]
regimes:
  s111: [1, 1, 1]
  s211: [2, 1, 1]
  s121: [1, 2, 1]
  s112: [1, 1, 2]
  s221: [2, 2, 1]
  s212: [2, 1, 2]
  s122: [1, 2, 2]
  s311: [3, 1, 1]
  s231: [2, 3, 1]
  s312: [3, 1, 2]
  s222: [2, 2, 2]
  s321: [3, 2, 1]
  s322: [3, 2, 2]
  s331: [3, 3, 1]
  s332: [3, 3, 2]
  s432: [4, 3, 2]

# ── Economic defaults (Future Planning UI / break-even module) ─────────────────────────────
cost_defaults:
  urgent_late_cost: 15.0
  normal_late_cost: 10.0
  worker_cost_per_hour: 18.0
  hours_per_worker_month: 160.0

# ── Bottleneck score weights (§7) — must sum to 1.0 ─────────────────────────────────────────
bottleneck_score:
  w_utilisation: 0.40
  w_p95_wait: 0.25
  w_late_wait_share: 0.20
  w_avg_queue: 0.15

# ── Analytical capacity estimate + dynamic candidate generation (§13/§14) ───────────────────
# Pre-simulation staffing anchor: expected deterministic workload (noise=1.0) per stage divided
# by (worker-month capacity x target utilisation), ceil'd, min 1 per active stage. This is a
# screening anchor, not the final recommendation — SimPy still determines the true answer after
# queueing/variability/sequencing/SLA effects (src/analysis/capacity_estimate.py).
capacity_planning:
  target_utilisation: 0.85
  candidate_count: 16        # dynamic candidates generated around the analytical centre

# ── Adaptive capacity search limits (§9/§18) ────────────────────────────────────────────────
# max_extra_workers_per_stage is RELATIVE to the analytical estimate for the stage being
# searched (analytical_estimate_stage + max_extra_workers_per_stage), not a single global cap —
# so legitimate high-capacity recommendations in peak months are never blocked by a ceiling
# sized for small regimes.
adaptive_search:
  max_extra_workers_per_stage: 4
  max_extra_iterations: 4
  max_candidates_per_iteration: 2
  close_bottleneck_threshold: 0.05   # if top-2 bottleneck scores are within this, test both

# ── RL generalisation: train / holdout regime split (§12.1), capacity feature scale (§21) ──
rl_generalisation:
  train_regimes: [s111, s211, s121, s221, s212, s122, s311, s312, s222, s321, s331, s332]
  holdout_regimes: [s112, s231, s322, s432]
  # Fixed normalisation scale for the RL state's cap_pick/cap_pack/cap_disp features
  # (env_fullstage_rl.py::FullStageRLRunner._state) — worker counts are divided by this and
  # clipped to [0, 1]. Sized above the largest workforce the corrected operating-time model is
  # expected to recommend at peak demand (dynamic candidates can legitimately exceed 9 workers
  # per stage — see src/analysis/regime_naming.py), so the feature never silently saturates.
  capacity_feature_scale: 20
