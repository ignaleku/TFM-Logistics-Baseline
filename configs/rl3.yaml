training:
  # Raised from 60 -> 120: training now samples uniformly across 12 regimes (vs 3 before),
  # so this keeps roughly the same average episodes-per-regime (~10) as before the widened mix.
  episodes: 120
  episode_orders: 10000
  lr: 0.001
  gamma: 0.99
  batch_size: 256
  target_update_steps: 2000
  train_start_size: 3000
  train_every_steps: 4
  updates_per_episode: 500
  ckpt_every: 10

epsilon:
  start: 1.0
  end: 0.05
  decay_steps: 200000

network:
  input_dim: 16   # [pick_u, pick_n, pack_u, pack_n, disp_u, disp_n, wip_pick, wip_pack, wip_disp,
                  #  time_norm, slack_u, slack_n, stage_id, cap_pick, cap_pack, cap_disp]
                  # cap_* added post-audit (§12) — see data/api_runs/latest/rl3_audit_report.json
  hidden_dim: 64

buffer:
  capacity: 200000

# RL-3 uses RL-1 reward by design — isolates the effect of acting at all stages.
# w_normal / late_penalty_normal were rebalanced post-audit: the previous values (2.0 / 1.0)
# gave normal orders an on-time<->late reward swing of 3.0 vs urgent's 7.0 (2.33x imbalance),
# a structural incentive to sacrifice normal orders whenever it helped urgent timeliness, with
# no floor protecting normal SLA. New values narrow the swing ratio to 7.0 vs 5.0 (1.4x) —
# urgent orders still matter more (as intended), but far less punitively to normal service.
# See rl3_audit_report.json::reward_audit for the measurement this is based on.
reward:
  reward_mode: rl1_current
  w_urgent: 5.0
  w_normal: 3.0
  late_penalty_urgent: 2.0
  late_penalty_normal: 2.0
  lateness_cap_mult: 2.0

# Training regime sampling — deliberately NOT duplicated here. main_train_rl3.py samples one
# regime per episode, uniformly, from configs/planning_profile.yaml::rl_generalisation
# ::train_regimes (12 stratified regimes spanning low/medium/high capacity). The 4 remaining
# base regimes (rl_generalisation::holdout_regimes) are exact-held-out and evaluated but never
# trained on — see src/rl/evaluate_rl3_generalisation.py.
