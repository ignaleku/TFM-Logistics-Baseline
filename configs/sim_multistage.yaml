simulation:
  random_seed: 123
  policy: urgent_first         # fifo | urgent_first
  time_unit: seconds

resources:
  picking_workers: 1
  packing_workers: 1
  dispatch_workers: 1


service_time:
  picking:
    base_minutes: 1.5
    minutes_per_item: 0.7
    class_multiplier: {A: 1.0, B: 1.2, C: 1.6}
    noise_lognormal_sigma: 0.25
    min_minutes: 0.2

  packing:
    base_minutes: 1.0
    minutes_per_item: 0.4
    class_multiplier: {A: 1.0, B: 1.1, C: 1.3}
    noise_lognormal_sigma: 0.20
    min_minutes: 0.2

  dispatch:
    base_minutes: 0.8
    minutes_per_item: 0.15
    class_multiplier: {A: 1.0, B: 1.05, C: 1.1}
    noise_lognormal_sigma: 0.15
    min_minutes: 0.2
