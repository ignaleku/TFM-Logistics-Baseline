simulation:
  random_seed: 123
  policy: urgent_first         # fifo | urgent_first
  time_unit: seconds

resources:
  picking_workers: 1
  packing_workers: 1
  dispatch_workers: 1


# Service-time model: service_time = (base + per_unit * workload_units) * clipped_noise
# workload_units are pre-computed per order (picking_units / packing_units / dispatch_units)
# and encode product_family × complexity_level × num_items heterogeneity.
#
# Calibration targets (normal/standard/medium order, 3 items):
#   picking  ≈ 3.5 min   packing ≈ 2.0 min   dispatch ≈ 1.2 min
#
service_time:
  picking:
    base_minutes: 0.5
    minutes_per_unit: 0.90
    noise_clip_lo: 0.80
    noise_clip_hi: 1.25
    min_minutes: 0.2

  packing:
    base_minutes: 0.5
    minutes_per_unit: 0.70
    noise_clip_lo: 0.80
    noise_clip_hi: 1.25
    min_minutes: 0.2

  dispatch:
    base_minutes: 0.5
    minutes_per_unit: 0.65
    noise_clip_lo: 0.80
    noise_clip_hi: 1.25
    min_minutes: 0.2